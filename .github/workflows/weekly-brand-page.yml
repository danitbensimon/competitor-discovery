name: Weekly brand page (auto-publish)

on:
  schedule:
    - cron: "0 8 * * 1"      # every Monday 08:00 UTC
  workflow_dispatch:          # manual "Run workflow" button

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Install Python deps (Excel builder)
        run: pip install --quiet openpyxl

      - name: Run brand-page-research-agent
        run: |
          claude -p "Use the brand-page-research-agent to research this week's new competitor brand and write all output files into the repo per its instructions: astro-site/src/data/competitors/<slug>.json, astro-site/public/downloads/<slug>_customers.xlsx, and append the brand to astro-site/public/lists-index.json. Then print the review report." \
            --permission-mode dontAsk \
            --allowedTools "Agent(brand-page-research-agent),Bash,Read,Write,Edit,WebSearch,WebFetch,Skill,Task" \
            | tee agent-report.txt

      - name: Publish to main (commit + push)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add astro-site/src/data/competitors/*.json astro-site/public/lists-index.json
          git add -f astro-site/public/downloads/*_customers.xlsx
          if git diff --cached --quiet; then
            echo "No new page to publish this run."
          else
            git commit -m "Publish weekly competitor brand page (auto)"
            git push
          fi
